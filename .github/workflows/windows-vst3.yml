name: Windows x64 – native Steinberg VST3 P001
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build_and_test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build with pinned SDK
        shell: cmd
        run: call build_windows.bat
      - name: Offline A/B WAV pipeline self-test
        shell: pwsh
        run: |
          python tools/compare_vocaid.py --renderer build-win/Release/vocaid_ab_renderer.exe --selftest
      - name: Steinberg VST3 Validator (basic)
        shell: pwsh
        run: |
          $validator = Join-Path $PWD 'build-win/bin/Release/validator.exe'
          if (-not (Test-Path $validator)) { throw 'Steinberg validator.exe missing' }
          $bundle = Get-ChildItem build-win -Recurse -Directory -Filter '*.vst3' | Where-Object { $_.Name -like '*Retro*' -or $_.Name -like '*A125*' } | Select-Object -First 1
          if (-not $bundle) { throw 'VST3 bundle missing for validator' }
          & $validator $bundle.FullName
          if ($LASTEXITCODE -ne 0) { throw "VST3 validator failed (exit $LASTEXITCODE)" }
      - name: Package VST3 candidate
        shell: pwsh
        run: |
          $bundle = Get-ChildItem build-win -Recurse -Directory -Filter '*.vst3' | Where-Object { $_.Name -like '*Retro*' -or $_.Name -like '*A125*' } | Select-Object -First 1
          if (-not $bundle) { throw 'Windows VST3 bundle missing' }
          Compress-Archive -Path $bundle.FullName -DestinationPath 125A-Retro-Reverb-P001-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: 125A-Retro-Reverb-P001-Windows-x64-VST3-CANDIDATE
          path: 125A-Retro-Reverb-P001-Windows-x64.zip
          if-no-files-found: error
